[project]
name = "masteropencv"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Vivekanand-s-naik", email = "vivekanadsnaik.iet@srinivasuniversity.edu.in" }
]
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141.1",
    "ipykernel>=7.3.0",
    "langchain>=1.3.16",
    "langchain-community>=0.4.2",
    "numpy>=2.4.6",
    "opencv-python>=5.0.0.93",
    "ultralytics>=8.4.126",
    "uvicorn>=0.52.4",
]

[project.scripts]
masteropencv = "masteropencv:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
